kind: cjm
version: '1.0'
id: cjm:ai-operating-model-redesign
persona:
  name: AI導入責任者
  description: >-
    AIの利用率ではなく、誰がどの業務を作り替え、どの業務成果をどの根拠で評価するかを確認する責任者。
    Deutsche Telekomの公開情報を例に、責任配置と証拠の不足を自組織用に編集する。
phases:
  - id: cjm:phase:select
    name: 対象業務を選ぶ
  - id: cjm:phase:experiment
    name: 現場で試す
  - id: cjm:phase:redesign
    name: 業務を作り替える
  - id: cjm:phase:measure
    name: 業務成果を測る
  - id: cjm:phase:evaluate
    name: 根拠を評価する
  - id: cjm:phase:decide
    name: 判断を更新する
actions:
  - id: cjm:action:select-process
    name: 利用率ではなく業務成果を測れる対象を選ぶ
    phase: cjm:phase:select
    touchpoints:
      - AI投資審査
      - 業務プロセス一覧
    thoughts_feelings:
      - ツールの配布数だけでは投資継続を判断できない
      - 対象業務と期待する成果を先に固定したい
    emotion_score: -1
  - id: cjm:action:run-experiment
    name: 現場実験でAIと人間の役割を確かめる
    phase: cjm:phase:experiment
    touchpoints:
      - 実験記録
      - 現場ヒアリング
    thoughts_feelings:
      - 実務で使える範囲と人間へ戻す条件が見えてきた
      - 成功例だけでなく失敗と移管も記録したい
    emotion_score: 0
  - id: cjm:action:redesign-operating-model
    name: 業務責任者が人間とAIの分担を再設計する
    phase: cjm:phase:redesign
    touchpoints:
      - 業務フロー
      - 責任分担表
    thoughts_feelings:
      - 導入担当ではなく業務責任者が再設計を引き受けた
      - 5つの業務レイヤーを同じ観点で比較できる
    emotion_score: 1
  - id: cjm:action:measure-outcome
    name: 指標定義と測定経路を確定する
    phase: cjm:phase:measure
    touchpoints:
      - 指標定義書
      - 測定ログ
    thoughts_feelings:
      - 利用率と業務成果を混同せずに測れる
      - 分母と対象期間がなければ成果値を採用できない
    emotion_score: 0
  - id: cjm:action:evaluate-evidence
    name: 情報源と独立検証とAIへの帰属を評価する
    phase: cjm:phase:evaluate
    touchpoints:
      - 一次資料
      - 証拠評価表
    thoughts_feelings:
      - 会社発表と第三者検証を分けて読める
      - 根拠が不足する値を成果判断から外せる
    emotion_score: -1
  - id: cjm:action:update-decision
    name: 継続と拡大と見直しを根拠付きで決める
    phase: cjm:phase:decide
    touchpoints:
      - 投資判断会議
      - 次期測定計画
    thoughts_feelings:
      - 誰が何を追加計測するかまで決められる
      - 証拠不足を成功扱いせず次の行動へ戻せる
    emotion_score: 1
---
kind: sbp
version: '1.0'
id: sbp:ai-operating-model-redesign
lanes:
  - id: sbp:lane:cjm
    name: AI導入責任者の判断
    kind: cjm
    position:
      x: -60
      'y': 80
    size:
      width: 2320
      height: 150
  - id: sbp:lane:management
    name: 経営
    kind: team
