    position:
      x: -60
      'y': 270
    size:
      width: 2320
      height: 180
  - id: sbp:lane:governance
    name: AI統括機構（AICCを参考にした役割）
    kind: team
    description: DTのAICCが担うAI専門性の集約と技術支援を参考に、責任割当と判断更新を支援する。本サンプルの分掌はDTの正式な分掌ではない。
    position:
      x: -60
      'y': 490
    size:
      width: 2320
      height: 220
  - id: sbp:lane:frontline
    name: 現場
    kind: human
    description: 実務でAIを試し、失敗条件と人間への移管条件を記録する。
    position:
      x: -60
      'y': 750
    size:
      width: 2320
      height: 180
  - id: sbp:lane:process-owner
    name: 業務責任者
    kind: team
    description: 5つの業務レイヤーごとに人間とAIの役割を再設計する。
    position:
      x: -60
      'y': 970
    size:
      width: 2320
      height: 280
  - id: sbp:lane:measurement
    name: 計測担当
    kind: team
    description: 指標定義と測定経路を確定し、成果値の証拠品質を評価する。
    position:
      x: -60
      'y': 1290
    size:
      width: 2320
      height: 220
tasks:
  - id: sbp:task:select-process
    lane: sbp:lane:management
    name: 評価対象の業務プロセスを選ぶ
    description: 利用率ではなく、品質、顧客影響、工数のいずれかを測れる業務を選ぶ。
    source_id: cjm:action:select-process
    position:
      x: 60
      'y': 50
  - id: sbp:task:assign-owner
    lane: sbp:lane:governance
    name: 再設計責任者を割り当てる
    description: AI導入チームではなく、業務成果に責任を持つ役割を各プロセスへ割り当てる。
    source_id: cjm:action:redesign-operating-model
    position:
      x: 580
      'y': 50
  - id: sbp:task:update-decision
    lane: sbp:lane:governance
    name: 継続と拡大と見直しを決める
    description: 6項目がそろわない場合は成果を断定せず、責任者を指定して測定設計へ戻す。
    source_id: cjm:action:update-decision
    position:
      x: 1940
      'y': 50
  - id: sbp:task:run-experiment
    lane: sbp:lane:frontline
    name: 現場実験と失敗条件を記録する
    description: AIが処理する範囲と、人間が判断を引き継ぐ条件を実務で確かめる。
    source_id: cjm:action:run-experiment
    position:
      x: 360
      'y': 50
  - id: sbp:task:design-human-handoff
    lane: sbp:lane:frontline
    name: 人間への移管を設計する
    description: AIが解決できない場合と顧客が希望する場合の移管先と記録方法を定める。
    source_id: cjm:action:redesign-operating-model
    position:
      x: 720
      'y': 50
  - id: sbp:task:redesign-customer-support
    lane: sbp:lane:process-owner
    name: 顧客対応を再設計する
    description: 顧客対応責任者がFrag Magentaと人間の分担を設計する。自律解決率56%は会社報告値であり、分母の範囲と内部の測定経路は公開されていない。
    source_id: cjm:action:redesign-operating-model
    position:
      x: 500
      'y': 50
  - id: sbp:task:redesign-network-operations
    lane: sbp:lane:process-owner
    name: ネットワーク運用を再設計する
    description: ネットワーク運用責任者が容量最適化の分担を設計する。1日最大1,500件のmicro-eventsを特定するという二次情報はあるが、判断用の指標定義と測定経路が不足する。
    source_id: cjm:action:redesign-operating-model
    position:
      x: 780
      'y': 50
  - id: sbp:task:redesign-voice-service
    lane: sbp:lane:process-owner
    name: 音声サービスを再設計する
    description: 音声サービス責任者がvoicebotの提供範囲を設計する。2025年度実績の説明では6月に提供開始したとあるが、年の明記と業務成果値はない。
    source_id: cjm:action:redesign-operating-model
    position:
      x: 1060
      'y': 50
  - id: sbp:task:redesign-internal-work
    lane: sbp:lane:process-owner
    name: 社内業務を再設計する
    description: 各業務部門の責任者がAskTを組み込む業務を設計する。導入の事実と利用状況は業務成果として扱わない。
    source_id: cjm:action:redesign-operating-model
    position:
      x: 640
      'y': 160
  - id: sbp:task:redesign-b2b
    lane: sbp:lane:process-owner
    name: B2Bサービスを再設計する
    description: B2B事業責任者がAIサービスを顧客業務へ組み込む範囲を設計する。サービス提供の事実だけでは顧客成果を判断できない。
    source_id: cjm:action:redesign-operating-model
    position:
      x: 920
      'y': 160
  - id: sbp:task:define-metric
    lane: sbp:lane:measurement
    name: 指標名と単位と分母を定義する
    description: 利用率と業務成果を分け、対象期間と分母を含む指標定義を作る。
    source_id: cjm:action:measure-outcome
    position:
      x: 1180
      'y': 50
  - id: sbp:task:confirm-measurement-route
    lane: sbp:lane:measurement
    name: データ源と取得頻度を確認する
    description: 成果値のデータ源、取得方法、確認頻度を記録して再計測できる状態にする。
    source_id: cjm:action:measure-outcome
    position:
      x: 1460
      'y': 50
  - id: sbp:task:evaluate-evidence
    lane: sbp:lane:measurement
    name: 成果値の証拠品質を評価する
    description: 情報源、独立検証、AIへの帰属を分類し、中核根拠と補助根拠と判断に使わない値を分ける。
    source_id: cjm:action:evaluate-evidence
    position:
      x: 1740
      'y': 50
  - id: cjm:action:select-process
    lane: sbp:lane:cjm
    name: 利用率ではなく業務成果を測れる対象を選ぶ
    readonly: true
