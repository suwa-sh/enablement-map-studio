kind: outcome
version: '1.0'
id: oc:ai-operating-model-redesign
kgi:
  id: oc:kgi:decision-ready-ai-redesign
  name: AI導入を責任配置と検証可能な業務成果に基づいて判断できる
primary_csf:
  id: oc:csf:evidence-ready-process
  kgi_id: oc:kgi:decision-ready-ai-redesign
  source_id: sbp:task:evaluate-evidence
  rationale: >-
    AIの利用率だけでは投資継続を判断できない。
    業務責任者が人間とAIの役割を再設計し、指標定義と測定経路を持ち、情報源と独立検証とAIへの帰属を説明できることが必要である。
primary_kpi:
  id: oc:kpi:decision-ready-process-rate
  csf_id: oc:csf:evidence-ready-process
  name: 判断可能な再設計プロセス率
  definition: >-
    分子は、責任者、指標定義、測定経路、情報源、AIへの帰属、独立検証の6項目を満たす評価対象プロセス数とする。
    分母は、評価対象に選んだプロセス数とする。
    各プロセスでは採否にかかわらず主根拠を1件指定し、その責任者とメタデータに対して6項目を判定する。
    主根拠はAI運用を最も直接的に測る値を選び、該当する値がない場合は公開情報で確認できる導入事実を選ぶ。
    主根拠が存在しない場合は未指定と記録し、責任者以外の5項目を未充足とする。
    採否は成果を断定できるかの判定に使う。
  unit: '%'
  target: 100
---
